<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="imageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#imageGradient)"/>
  
  <!-- Appointment Management System Illustration -->
  
  <!-- Calendar Icon (Large) -->
  <rect x="50" y="50" width="80" height="70" rx="8" fill="white" opacity="0.9"/>
  <rect x="60" y="60" width="60" height="50" rx="4" fill="#667eea"/>
  
  <!-- Calendar Grid -->
  <rect x="65" y="75" width="8" height="6" fill="white"/>
  <rect x="77" y="75" width="8" height="6" fill="white"/>
  <rect x="89" y="75" width="8" height="6" fill="white"/>
  <rect x="101" y="75" width="8" height="6" fill="white"/>
  <rect x="65" y="85" width="8" height="6" fill="white"/>
  <rect x="77" y="85" width="8" height="6" fill="white"/>
  <rect x="89" y="85" width="8" height="6" fill="white"/>
  <rect x="101" y="85" width="8" height="6" fill="white"/>
  <rect x="65" y="95" width="8" height="6" fill="white"/>
  <rect x="77" y="95" width="8" height="6" fill="white"/>
  <rect x="89" y="95" width="8" height="6" fill="white"/>
  <rect x="101" y="95" width="8" height="6" fill="white"/>
  
  <!-- User Icons -->
  <circle cx="200" cy="80" r="25" fill="white" opacity="0.9"/>
  <circle cx="200" cy="75" r="8" fill="#667eea"/>
  <path d="M 185 95 A 15 12 0 0 1 215 95 Z" fill="#667eea"/>
  
  <circle cx="280" cy="120" r="20" fill="white" opacity="0.8"/>
  <circle cx="280" cy="116" r="6" fill="#764ba2"/>
  <path d="M 268 128 A 12 10 0 0 1 292 128 Z" fill="#764ba2"/>
  
  <circle cx="320" cy="80" r="20" fill="white" opacity="0.8"/>
  <circle cx="320" cy="76" r="6" fill="#43e97b"/>
  <path d="M 308 88 A 12 10 0 0 1 332 88 Z" fill="#43e97b"/>
  
  <!-- Clock -->
  <circle cx="150" cy="180" r="30" fill="white" opacity="0.9"/>
  <circle cx="150" cy="180" r="25" fill="#f7fafc"/>
  <circle cx="150" cy="180" r="3" fill="#667eea"/>
  <!-- Clock hands -->
  <line x1="150" y1="180" x2="150" y2="165" stroke="#667eea" stroke-width="2"/>
  <line x1="150" y1="180" x2="165" y2="180" stroke="#667eea" stroke-width="1"/>
  
  <!-- Document/Report Icons -->
  <rect x="250" y="160" width="40" height="50" rx="4" fill="white" opacity="0.9"/>
  <rect x="255" y="170" width="30" height="2" fill="#667eea"/>
  <rect x="255" y="175" width="25" height="2" fill="#667eea"/>
  <rect x="255" y="180" width="30" height="2" fill="#667eea"/>
  <rect x="255" y="185" width="20" height="2" fill="#667eea"/>
  <rect x="255" y="190" width="30" height="2" fill="#667eea"/>
  <rect x="255" y="195" width="25" height="2" fill="#667eea"/>
  
  <!-- Charts/Analytics -->
  <rect x="310" y="170" width="40" height="30" rx="2" fill="white" opacity="0.9"/>
  <!-- Bar chart -->
  <rect x="315" y="190" width="4" height="8" fill="#667eea"/>
  <rect x="322" y="187" width="4" height="11" fill="#764ba2"/>
  <rect x="329" y="185" width="4" height="13" fill="#43e97b"/>
  <rect x="336" y="192" width="4" height="6" fill="#f093fb"/>
  
  <!-- Connection Lines -->
  <line x1="130" y1="90" x2="175" y2="90" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="225" y1="85" x2="260" y2="110" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="300" y1="125" x2="315" y2="175" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="180" y1="180" x2="250" y2="180" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <!-- Title Text -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">AppointPro</text>
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.9">Professional Appointment Management</text>
</svg>
