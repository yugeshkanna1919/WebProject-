<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Appointments - Appointment Management System</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-calendar-check"></i>
                <h2>AppointPro</h2>
            </div>
            <ul class="nav-links">
                <li>
                    <a href="index.html">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="add-appointment.html">
                        <i class="fas fa-plus-circle"></i>
                        <span>Add Appointment</span>
                    </a>
                </li>
                <li class="active">
                    <a href="appointments.html">
                        <i class="fas fa-list"></i>
                        <span>View Appointments</span>
                    </a>
                </li>
                <li>
                    <a href="calendar.html">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Calendar</span>
                    </a>
                </li>
                <li>
                    <a href="clients.html">
                        <i class="fas fa-users"></i>
                        <span>Clients</span>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="appointmentManager.checkSettingsAccess()">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1>All Appointments</h1>
                    <p>Manage and view all scheduled appointments.</p>
                </div>
                <div class="header-right">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search appointments...">
                    </div>
                    <button class="btn btn-primary" onclick="window.location.href='add-appointment.html'">
                        <i class="fas fa-plus"></i>
                        Add Appointment
                    </button>
                    <div class="user-profile">
                        <img src="images/user-profile.svg" alt="User">
                        <span>Rajesh Kumar</span>
                    </div>
                </div>
            </header>

            <!-- Filters Section -->
            <div class="filters-section">
                <div class="filters-left">
                    <div class="filter-group">
                        <label for="status-filter">Status</label>
                        <select id="status-filter">
                            <option value="">All Status</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="provider-filter">Provider</label>
                        <select id="provider-filter">
                            <option value="">All Providers</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="type-filter">Type</label>
                        <select id="type-filter">
                            <option value="">All Types</option>
                            <option value="consultation">Consultation</option>
                            <option value="checkup">Checkup</option>
                            <option value="treatment">Treatment</option>
                            <option value="follow-up">Follow-up</option>
                            <option value="emergency">Emergency</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="date-from">From Date</label>
                        <input type="date" id="date-from">
                    </div>
                    <div class="filter-group">
                        <label for="date-to">To Date</label>
                        <input type="date" id="date-to">
                    </div>
                </div>
                <div class="filters-right">
                    <button class="btn btn-secondary" onclick="appointmentManager.clearFilters()">
                        <i class="fas fa-times"></i>
                        Clear Filters
                    </button>
                </div>
            </div>

            <!-- Appointments Table -->
            <div class="table-container">
                <table class="appointments-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Client</th>
                            <th>Provider</th>
                            <th>Type</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Table content will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <div class="pagination-info">
                    Showing 1-10 of 25 appointments
                </div>
                <div class="pagination-controls">
                    <!-- Pagination will be populated by JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
