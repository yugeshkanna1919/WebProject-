<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Appointment - Appointment Management System</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-calendar-check"></i>
                <h2>AppointPro</h2>
            </div>
            <ul class="nav-links">
                <li>
                    <a href="index.html">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="active">
                    <a href="add-appointment.html">
                        <i class="fas fa-plus-circle"></i>
                        <span>Add Appointment</span>
                    </a>
                </li>
                <li>
                    <a href="appointments.html">
                        <i class="fas fa-list"></i>
                        <span>View Appointments</span>
                    </a>
                </li>
                <li>
                    <a href="calendar.html">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Calendar</span>
                    </a>
                </li>
                <li>
                    <a href="clients.html">
                        <i class="fas fa-users"></i>
                        <span>Clients</span>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="appointmentManager.checkSettingsAccess()">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1>Add New Appointment</h1>
                    <p>Schedule a new appointment with all the details.</p>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <img src="images/user-profile.svg" alt="User">
                        <span>Rajesh Kumar</span>
                    </div>
                </div>
            </header>

            <!-- Appointment Form -->
            <div class="form-container">
                <form class="appointment-form">
                    <div class="form-grid">
                        <!-- Client Information -->
                        <div class="form-section">
                            <h3><i class="fas fa-user"></i> Client Information</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="client-name">Client Name *</label>
                                    <input type="text" id="client-name" name="clientName" required>
                                </div>
                                <div class="form-group">
                                    <label for="client-email">Email</label>
                                    <input type="email" id="client-email" name="clientEmail">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="client-phone">Phone Number</label>
                                    <input type="tel" id="client-phone" name="clientPhone">
                                </div>
                                <div class="form-group">
                                    <label for="client-id">Client ID</label>
                                    <input type="text" id="client-id" name="clientId" placeholder="Auto-generated">
                                </div>
                            </div>
                        </div>

                        <!-- Appointment Details -->
                        <div class="form-section">
                            <h3><i class="fas fa-calendar"></i> Appointment Details</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="appointment-date">Date *</label>
                                    <input type="date" id="appointment-date" name="appointmentDate" required>
                                </div>
                                <div class="form-group">
                                    <label for="appointment-time">Time (15-min slots) *</label>
                                    <select id="appointment-time" name="appointmentTime" required>
                                        <option value="">Select time</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="duration">Duration *</label>
                                    <select id="duration" name="duration" required>
                                        <option value="15">15 minutes</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="appointment-type">Appointment Type *</label>
                                    <select id="appointment-type" name="appointmentType" required>
                                        <option value="">Select type</option>
                                        <option value="consultation">Consultation</option>
                                        <option value="checkup">Checkup</option>
                                        <option value="treatment">Treatment</option>
                                        <option value="follow-up">Follow-up</option>
                                        <option value="emergency">Emergency</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Provider Information -->
                        <div class="form-section">
                            <h3><i class="fas fa-user-md"></i> Provider Information</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="provider">Provider *</label>
                                    <select id="provider" name="provider" required>
                                        <option value="">Select provider</option>
                                        <option value="dr-raman">Dr. Priya Raman</option>
                                        <option value="dr-iyer">Dr. Rajesh Iyer</option>
                                        <option value="dr-kumar">Dr. Anjali Kumar</option>
                                        <option value="dr-sundaram">Dr. Vikram Sundaram</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="location">Location</label>
                                    <select id="location" name="location">
                                        <option value="">Select location</option>
                                        <option value="main-office">Main Office</option>
                                        <option value="branch-1">Branch Office 1</option>
                                        <option value="branch-2">Branch Office 2</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Additional Information -->
                        <div class="form-section">
                            <h3><i class="fas fa-info-circle"></i> Additional Information</h3>
                            <div class="form-group">
                                <label for="notes">Notes</label>
                                <textarea id="notes" name="notes" rows="4" placeholder="Enter any additional notes or special instructions..."></textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="priority">Priority</label>
                                    <select id="priority" name="priority">
                                        <option value="normal">Normal</option>
                                        <option value="high">High</option>
                                        <option value="urgent">Urgent</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="status">Status</label>
                                    <select id="status" name="status">
                                        <option value="scheduled">Scheduled</option>
                                        <option value="confirmed">Confirmed</option>
                                        <option value="pending">Pending</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary">
                            <i class="fas fa-times"></i>
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i>
                            Save Appointment
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
